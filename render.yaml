# Blueprint de despliegue para Render.com (plan gratuito)
#
# Como usarlo:
#   1. Sube este proyecto a un repositorio de GitHub.
#   2. Crea gratis una base de datos en Turso (ver README) y ten a mano su
#      URL y su token.
#   3. En Render: "New +" -> "Web Service" (o "Blueprint" si tu cuenta lo
#      ofrece) -> conecta este repositorio.
#   4. Completa las variables marcadas como "sync: false" en el panel de
#      Render antes de desplegar: ADMIN_EMAIL, ADMIN_PASSWORD,
#      TURSO_DATABASE_URL y TURSO_AUTH_TOKEN.

services:
  - type: web
    name: ruta-saber
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
