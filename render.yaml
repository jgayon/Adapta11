# Blueprint de despliegue para Render.com (plan gratuito)
#
# La base de datos ya no es Turso: es Roble (Uninorte OpenLab), compartida
# por todo el equipo. Render solo hospeda el servidor Node/Express; los
# datos viven en el proyecto de Roble `adapta11_c0f86002c5`.
#
# Como usarlo:
#   1. Sube este proyecto a un repositorio de GitHub.
#   2. En Render: "New +" -> "Web Service" (o "Blueprint" si tu cuenta lo
#      ofrece) -> conecta este repositorio.
#   3. Completa las variables marcadas como "sync: false" en el panel de
#      Render antes de desplegar: ADMIN_EMAIL, ADMIN_PASSWORD,
#      ROBLE_SERVICE_EMAIL y ROBLE_SERVICE_PASSWORD (la cuenta de servicio
#      de Roble, ver claude/plan-migracion-roble.md o pidela al equipo),
#      y GMAIL_USER/BREVO_API_KEY (para el correo de confirmacion de
#      profesor via la API de Brevo -no SMTP, Render la bloquea-, ver
#      .env.example).

services:
  - type: web
    name: ruta-saber
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ROBLE_BASE_URL
        value: https://roble-api.test-openlab.uninorte.edu.co
      - key: ROBLE_CONTRACT_ID
        value: adapta11_c0f86002c5
      - key: ROBLE_SERVICE_EMAIL
        sync: false
      - key: ROBLE_SERVICE_PASSWORD
        sync: false
      - key: APP_URL
        value: https://adapta11.onrender.com
      - key: GMAIL_USER
        sync: false
      - key: BREVO_API_KEY
        sync: false
